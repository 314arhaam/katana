name: "Split a docker image, merge and run it"

on:
  workflow_dispatch: 

jobs:
  build_katana:
    runs-on: ubuntu-22.04
    steps:
      
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Go mod tidy
        run: go mod tidy
      
      - name: Build go binaries
        shell: bash
        run: GOOS='linux' GOARCH='amd64' CGO_ENABLED=0 go build -o katana main.go
      
      - name: Upload katana binary
        uses: actions/upload-artifact@v4
        with:
          name: katana
          path: katana
          retention-days: 1
  
  pull_image:
    runs-on: ubuntu-22.04
    steps:
      
      - name: Check docker
        shell: bash
        run: docker ps

      - name: Pull Alpine image
        shell: bash
        run: docker pull alpine:latest

      - name: Check image
        shell: bash
        run: docker run --rm alpine:latest ls

      - name: Save image
        shell: bash
        run: docker image save alpine:latest -o alpine_image.tar && ls -lh

      - name: Upload saved image
        uses: actions/upload-artifact@v4
        with:
          name: image_file
          path: alpine_image.tar
          retention-days: 1
  
  split_file:
    needs: 
      - pull_image
      - build_katana
    runs-on: ubuntu-22.04
    steps:
      
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image_file
      
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: katana
      
      - name: Check files
        shell: bash
        run: ls -lh

      - name: Execute permission
        shell: bash
        run: chmod +x katana

      - name: Split with katana
        shell: bash
        run: ./katana split -f alpine_image.tar -s 2048 && ls -lh
      
      - name: Upload data patrs
        uses: actions/upload-artifact@v4
        with:
          name: data_parts
          path: alpine_image.tar.*
          retention-days: 1
      
  merge_files:
    needs: 
    - split_file
    runs-on: ubuntu-22.04
    steps:
      
      - name: Download data parts
        uses: actions/download-artifact@v4
        with:
          name: data_parts
      
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: katana
      
      - name: Check files
        shell: bash
        run: ls -lh

      - name: Execute permission
        shell: bash
        run: chmod +x katana

      - name: Merge with katana
        shell: bash
        run: ./katana merge -f alpine_image.tar && ls -lh

      - name: Upload merged file
        uses: actions/upload-artifact@v4
        with:
          name: merged_data
          path: katana_alpine_image.tar
          retention-days: 1

  final_image_test:
    needs: 
      - merge_files
    runs-on: ubuntu-22.04
    steps:
      - name: Download merged data
        uses: actions/download-artifact@v4
        with:
          name: merged_data
      
      - name: Show files
        shell: bash
        run: ls -lh
        
      - name: Load merged data into docker
        shell: bash
        run: docker load -i katana_alpine_image.tar

      - name: Show images
        shell: bash
        run: docker images
      
      - name: Run loaded image
        shell: bash
        run: docker run --rm alpine:latest ls
    
